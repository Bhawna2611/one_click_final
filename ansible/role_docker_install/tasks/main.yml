---
# ---------------------------------------------------------------------------
# Helper macro: wait until ALL apt/dpkg locks are released.
# Called multiple times so that an interleaving user_data apt process can't
# grab the lock between our check and our install step.
# ---------------------------------------------------------------------------
- name: Wait for apt/dpkg lock to be released (user_data may still be running)
  ansible.builtin.shell: |
    for lock in /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/lib/dpkg/lock; do
      while fuser "$lock" >/dev/null 2>&1; do
        echo "Waiting for $lock to be released..."
        sleep 5
      done
    done
  changed_when: false
  timeout: 600 # wait up to 10 min for user_data to finish

- name: Check if Docker is already installed
  ansible.builtin.command: docker --version
  register: docker_check
  changed_when: false
  failed_when: false

- name: Install Docker (skipped if already installed by user_data)
  when: docker_check.rc != 0
  block:
    # Wait again — user_data may have released the lock briefly and grabbed it
    # again in a subsequent apt call between our earlier check and now.
    - name: Wait for apt/dpkg lock again before first apt operation
      ansible.builtin.shell: |
        for lock in /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/lib/dpkg/lock; do
          while fuser "$lock" >/dev/null 2>&1; do
            echo "Waiting for $lock to be released..."
            sleep 5
          done
        done
      changed_when: false
      timeout: 600

    - name: Update apt package index
      ansible.builtin.apt:
        update_cache: true
        force_apt_get: true
        lock_timeout: 300 # ansible retries internally for up to 5 min

    - name: Install prerequisite system packages
      ansible.builtin.apt:
        pkg:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
          - python3-pip
        state: present
        lock_timeout: 300

    - name: Add Docker GPG key (modern signed-by method)
      ansible.builtin.shell: |
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
        chmod a+r /etc/apt/keyrings/docker.asc
      args:
        creates: /etc/apt/keyrings/docker.asc

    - name: Add Docker repository to apt sources
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker Engine (Community Edition)
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: true
        lock_timeout: 300

- name: Start Docker service and enable on boot
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Add ubuntu user to docker group
  ansible.builtin.user:
    name: ubuntu
    groups: docker
    append: true

- name: Check if Docker Compose is already installed
  ansible.builtin.command: docker-compose --version
  register: compose_check
  changed_when: false
  failed_when: false

- name: Install Docker Compose (skipped if already installed)
  ansible.builtin.get_url:
    url: "https://github.com/docker/compose/releases/download/v2.24.5/docker-compose-linux-x86_64"
    dest: /usr/local/bin/docker-compose
    mode: "0755"
  when: compose_check.rc != 0

- name: Verify Docker Compose installation
  ansible.builtin.command: docker-compose --version
  register: compose_version
  changed_when: false

- name: Display Docker Compose version
  ansible.builtin.debug:
    msg: "{{ compose_version.stdout }}"
