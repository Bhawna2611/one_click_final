[defaults]
host_key_checking = False
remote_user = ubuntu
private_key_file = /tmp/one__click.pem
stdout_callback = yaml
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
retries = 3
